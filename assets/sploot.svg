<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Sploot icon (placeholder): corgi lying flat, two stubby hind legs stretched toward the viewer -->
  <defs>
    <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath>
    <g id="paw">
      <circle cx="0" cy="0" r="82" fill="#FFF4E6"/>
      <path d="M-37 6 Q-41 -39 0 -43 Q41 -39 37 6 Q20 21 0 12 Q-20 21 -37 6 Z" fill="#D8697A"/>
      <ellipse cx="-45" cy="31" rx="13" ry="16" fill="#D8697A" transform="rotate(-25 -45 31)"/>
      <ellipse cx="-16" cy="49" rx="13" ry="16" fill="#D8697A" transform="rotate(-8 -16 49)"/>
      <ellipse cx="16"  cy="49" rx="13" ry="16" fill="#D8697A" transform="rotate(8 16 49)"/>
      <ellipse cx="45"  cy="31" rx="13" ry="16" fill="#D8697A" transform="rotate(25 45 31)"/>
    </g>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="#1E2940"/>
    <!-- low to the ground -->
    <rect x="64" y="438" width="384" height="12" rx="6" fill="#2F3F5E"/>
    <!-- body + stubby legs as one orange silhouette -->
    <g fill="#EE9440">
      <ellipse cx="256" cy="14" rx="250" ry="204"/>
      <rect x="100" y="100" width="140" height="240" rx="70"/>
      <rect x="272" y="100" width="140" height="240" rx="70"/>
    </g>
    <!-- rounded gap between the legs -->
    <rect x="240" y="196" width="32" height="220" rx="16" fill="#1E2940"/>
    <use href="#paw" transform="translate(170 340)"/>
    <use href="#paw" transform="translate(342 340)"/>
  </g>
</svg>
